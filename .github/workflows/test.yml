name: Tests
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Chrome and DevTools smoke
        run: node scripts/browser-smoke.js
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Run tests
        run: npm test
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
